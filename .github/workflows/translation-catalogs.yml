name: Validate gettext translation catalogs

on:
  push:
    branches: [main]
    paths:
      - '**/locale/**'
      - 'scripts/validate_translation_catalogs.py'
      - 'deployment/django/Dockerfile'
      - '.github/workflows/translation-catalogs.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/locale/**'
      - 'scripts/validate_translation_catalogs.py'
      - 'deployment/django/Dockerfile'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate every compiled gettext catalog
        run: python scripts/validate_translation_catalogs.py
