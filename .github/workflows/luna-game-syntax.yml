name: Luna game and demo account syntax

on:
  push:
    branches: [main]
    paths:
      - 'luna_game/**'
      - 'account/management/commands/setup_sofia_demo_parent.py'
      - 'account/tests_demo_parent.py'
      - '.github/workflows/luna-game-syntax.yml'
  pull_request:
    branches: [main]
    paths:
      - 'luna_game/**'
      - 'account/management/commands/setup_sofia_demo_parent.py'
      - 'account/tests_demo_parent.py'

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile changed Python modules
        run: |
          python -m compileall -q luna_game
          python -m py_compile account/management/commands/setup_sofia_demo_parent.py account/tests_demo_parent.py
