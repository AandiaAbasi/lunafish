# ==============================================================================
# lunafish.app — LunaFish
# Landing page + Django + Centrifugo + Mediasoup
# ==============================================================================

# HTTP -> HTTPS
server {
    listen 80;
    server_name lunafish.app www.lunafish.app;

    # Let's Encrypt / Certbot challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;

    server_name lunafish.app www.lunafish.app;
    server_tokens off;

    # --------------------------------------------------------------------------
    # SSL
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------------------------
    # Global
    # --------------------------------------------------------------------------
    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Landing page files mounted inside the nginx container.
    # Put index.html at: /var/www/lunafish/index.html
    root /var/www/lunafish;
    index index.html;

    # --------------------------------------------------------------------------
    # LunaFish landing page — only the website root
    # --------------------------------------------------------------------------
    location = / {
        try_files /index.html =404;
    }

    # Avoid an unnecessary 404 in browsers if no favicon exists yet.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # --------------------------------------------------------------------------
    # Django API
    # Keeps /api/... unchanged when forwarding to Django.
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # Django admin
    # --------------------------------------------------------------------------
    location /admin/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --------------------------------------------------------------------------
    # Django i18n
    # --------------------------------------------------------------------------
    location /i18n/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --------------------------------------------------------------------------
    # Django recommendation
    # --------------------------------------------------------------------------
    location /recommendation/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # Django static files
    # The nginx container must have this volume/path mounted.
    # --------------------------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Django media files
    # The nginx container must have this volume/path mounted.
    # --------------------------------------------------------------------------
    location /media/ {
        alias /app/mediafiles/;
        expires 7d;
    }

    # --------------------------------------------------------------------------
    # Centrifugo
    # Public:   /realtime/connection/websocket
    # Upstream: /connection/websocket
    # --------------------------------------------------------------------------
    location /realtime/ {
        proxy_pass http://centrifugo:8000/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Mediasoup RTC
    # This intentionally preserves the /rtc/... URI for the upstream service.
    # --------------------------------------------------------------------------
    location /rtc/ {
        proxy_pass http://mediasoup:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Health check
    # --------------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # --------------------------------------------------------------------------
    # Everything else stays closed instead of accidentally exposing files.
    # --------------------------------------------------------------------------
    location / {
        return 404;
    }
}
